# 유블랙 Pages CMS 설정 (탬블 표준 양식 파일럿)
# 콘텐츠: content/*.json  /  사진: assets/

media:
  - name: images
    label: "사진"
    input: assets
    output: /assets
    rename: safe
    extensions: [jpg, jpeg, png, webp]

content:
  - name: site
    label: "기본정보 (연락처·주소)"
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: "상호"
        type: string
      - name: owner
        label: "대표자"
        type: string
      - name: biz_no
        label: "사업자등록번호"
        type: string
      - name: phone
        label: "전화번호"
        type: string
        description: "예: 010-1234-5678 (전화 버튼 링크도 자동으로 바뀌어요)"
      - name: kakao_url
        label: "카카오톡 채널 링크"
        type: string
      - name: naver_place_url
        label: "네이버 플레이스 링크"
        type: string
      - name: instagram_url
        label: "인스타그램 링크"
        type: string
      - name: instagram_id
        label: "인스타그램 아이디"
        type: string
      - name: youtube_url
        label: "유튜브 링크"
        type: string
      - name: youtube_id
        label: "유튜브 아이디"
        type: string
      - name: blog_url
        label: "블로그 링크"
        type: string
      - name: address
        label: "주소"
        type: string
        description: "지도도 이 주소로 자동으로 바뀌어요"
      - name: address_detail
        label: "주소 상세 (건물명 등)"
        type: string
      - name: booking_note
        label: "예약 안내 (주소 옆에 표시)"
        type: string
      - name: cta_text
        label: "하단 상담 문구"
        type: text
        description: "줄을 바꾸면 홈페이지에서도 줄이 바뀌어요"
      - name: disclaimer
        label: "하단 안내 문구"
        type: text
  - name: home
    label: "홈 (메인 페이지)"
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero
        label: "01. 메인 첫 화면"
        type: object
        fields:
          - name: label
            label: "작은 영문 라벨"
            type: string
          - name: title
            label: "큰 문구"
            type: text
            description: "엔터로 줄을 바꿀 수 있어요"
          - name: left
            label: "하단 왼쪽 문구"
            type: string
          - name: text
            label: "하단 오른쪽 문구"
            type: text
      - name: director
        label: "02. 대표원장"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: photo
            label: "프로필 사진"
            type: image
            description: "세로 4:5 비율 권장"
            options:
              media: images
          - name: name
            label: "이름"
            type: string
          - name: title
            label: "제목"
            type: text
          - name: paragraphs
            label: "소개 문단 (문단마다 하나씩)"
            type: text
            list:
              max: 5
          - name: note_label
            label: "하단 작은 제목"
            type: string
          - name: note_text
            label: "하단 설명"
            type: text
      - name: statement
        label: "03. 브랜드 메시지"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: text
          - name: text
            label: "설명"
            type: text
      - name: cases
        label: "04. 실제 작업 사례"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: desc
            label: "설명"
            type: text
          - name: items
            label: "사례 사진"
            type: object
            list:
              max: 6
              collapsible:
                collapsed: true
                summary: "{id} {area}"
            fields:
              - name: id
                label: "번호 (예: CASE 014)"
                type: string
              - name: area
                label: "부위"
                type: string
              - name: image
                label: "사진"
                type: image
                description: "세로 4:5 비율 권장"
                options:
                  media: images
      - name: why
        label: "05. 유블랙의 기준"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: text
          - name: items
            label: "항목"
            type: object
            list:
              max: 6
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: "영문 제목"
                type: string
              - name: desc
                label: "설명"
                type: text
      - name: programs
        label: "06. 프로그램"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: items
            label: "프로그램"
            type: object
            list:
              max: 12
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: "이름"
                type: string
              - name: en
                label: "영문 이름"
                type: string
              - name: link
                label: "눌렀을 때 이동할 주소"
                type: string
              - name: desc
                label: "설명"
                type: text
              - name: image
                label: "사진"
                type: image
                description: "세로 4:5 비율 권장"
                options:
                  media: images
      - name: records
        label: "07. 작업의 기록"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: desc
            label: "설명"
            type: text
          - name: items
            label: "기록"
            type: object
            list:
              max: 8
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: "분류 (영문)"
                type: string
              - name: text
                label: "내용"
                type: text
              - name: image
                label: "사진"
                type: image
                description: "세로 4:5 비율 권장"
                options:
                  media: images
      - name: process
        label: "08. 진행 과정"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: text
          - name: cost
            label: "비용 안내 문구"
            type: text
          - name: steps
            label: "단계"
            type: object
            list:
              max: 8
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: "단계 이름 (영문)"
                type: string
              - name: desc
                label: "설명"
                type: text
      - name: studies
        label: "09. 상담에서 작업까지"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: items
            label: "사례"
            type: object
            list:
              max: 6
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: "제목"
                type: string
              - name: worry
                label: "고민"
                type: text
              - name: direction
                label: "디자인 방향"
                type: text
              - name: image
                label: "사진"
                type: image
                description: "세로 4:5 비율 권장"
                options:
                  media: images
      - name: reviews
        label: "10. 고객 후기"
        type: object
        description: "후기 내용은 [후기] 메뉴에서 고쳐요. \"홈에 보이기\"를 켠 후기만 홈에 나와요."
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
      - name: academy
        label: "11. 아카데미"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: text
          - name: text
            label: "설명"
            type: text
          - name: image1
            label: "사진 1"
            type: image
            description: "세로 4:5 비율 권장"
            options:
              media: images
          - name: image1_label
            label: "사진 1 라벨"
            type: string
          - name: image2
            label: "사진 2"
            type: image
            description: "세로 4:5 비율 권장"
            options:
              media: images
          - name: image2_label
            label: "사진 2 라벨"
            type: string
      - name: journal
        label: "12. 블로그 글"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: desc
            label: "설명"
            type: text
          - name: items
            label: "글"
            type: object
            list:
              max: 6
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: label
                label: "분류 (영문)"
                type: string
              - name: title
                label: "제목"
                type: string
              - name: desc
                label: "설명"
                type: text
              - name: link
                label: "블로그 글 링크"
                type: string
      - name: space
        label: "13. 오시는 길"
        type: object
        description: "주소는 [기본정보] 메뉴에서 고쳐요."
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
      - name: faq
        label: "14. 자주 묻는 질문"
        type: object
        fields:
          - name: show
            label: "보이기"
            type: boolean
            description: "끄면 이 섹션이 홈페이지에서 숨겨져요"
          - name: title
            label: "제목"
            type: string
          - name: items
            label: "질문"
            type: object
            list:
              max: 20
              collapsible:
                collapsed: true
                summary: "{q}"
            fields:
              - name: q
                label: "질문"
                type: string
              - name: a
                label: "답변"
                type: text
  - name: reviews
    label: "후기"
    type: file
    path: content/reviews.json
    format: json
    fields:
      - name: items
        label: "후기 목록"
        type: object
        list:
          max: 60
          collapsible:
            collapsed: true
            summary: "{index}. {title}"
        fields:
          - name: title
            label: "목록 제목 (관리용)"
            type: string
            description: "관리 화면 목록에만 보이는 짧은 이름이에요. 홈페이지에는 안 나와요. 예: 정수리 후기"
          - name: image
            label: "사진"
            type: image
            description: "세로 4:5 비율 권장"
            options:
              media: images
          - name: focus
            label: "사진 초점 위치 (선택)"
            type: string
            description: "사진이 잘릴 때 보일 위치. 예: 50% 40% / 모르면 비워두세요"
          - name: text
            label: "후기 내용"
            type: text
          - name: home
            label: "홈에 보이기"
            type: boolean
  - name: brand
    label: "페이지 · 브랜드"
    type: file
    path: content/brand.json
    format: json
    fields:
      - name: t
        label: "화면 문구·사진"
        type: object
        description: "화면에 보이는 순서대로예요. 편집 모드(/edit)에서 화면을 보면서 고치는 게 더 편해요."
        fields:
          - name: k01
            label: "k01 · BRAND"
            type: string
          - name: k02
            label: "k02 · SCALP DESIGN STUDIO"
            type: text
          - name: k03
            label: "k03 · 브랜드 소개"
            type: string
          - name: k04
            label: "k04 · 유블랙 · U.BLACK · ULSAN"
            type: string
          - name: k05
            label: "k05 · 대표원장이 직접 운영하는 독립적인 SMP…"
            type: text
          - name: k06
            label: "k06 · U.BLACK STORY"
            type: string
          - name: k07
            label: "k07 · 보이게 만드는 것보다 어우러지게 만드는 …"
            type: text
          - name: k08
            label: "k08 · 유블랙은 개인의 두상과 기존 모발의 방향…"
            type: text
          - name: k09
            label: "k09 · PHILOSOPHY"
            type: string
          - name: k10
            label: "k10 · DIRECTOR"
            type: string
          - name: k11
            label: "k11 · 조영진"
            type: string
          - name: k12
            label: "k12 · 시술을 해 준 사람이 아닌, 고마운 사람…"
            type: text
          - name: k13
            label: "k13 · 상담에서 가장 먼저 보는 것은 얼마나 넓…"
            type: text
          - name: k14
            label: "k14 · 두상과 기존 모발의 흐름, 두피가 드러나…"
            type: text
          - name: k15
            label: "k15 · INDEPENDENT STUDIO"
            type: string
          - name: k16
            label: "k16 · 유블랙은 특정 프랜차이즈에 소속되지 않은…"
            type: text
          - name: k17
            label: "k17 · 브랜드 운영 구조보다 실제 작업과 고객 …"
            type: text
          - name: k18
            label: "k18 · RECORD"
            type: string
          - name: k19
            label: "k19 · 경력 · 활동 아카이브"
            type: string
          - name: k20
            label: "k20 · 다양한 시술 및 교육 경험을 바탕으로 운…"
            type: string
          - name: k21
            label: "k21 · SPACE"
            type: string
          - name: k22
            label: "k22 · ULSAN STUDIO"
            type: string
          - name: k23
            label: "k23 · LOCATION →"
            type: string
          - name: img01
            label: "img01 · 사진"
            type: image
            options:
              media: images
          - name: img02
            label: "img02 · 사진"
            type: image
            options:
              media: images
          - name: img03
            label: "img03 · 사진"
            type: image
            options:
              media: images
          - name: img04
            label: "img04 · 사진"
            type: image
            options:
              media: images
          - name: img05
            label: "img05 · 사진"
            type: image
            options:
              media: images
      - name: phil
        label: "철학 (3단계)"
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{t}"
        fields:
          - name: t
            label: "영문 제목"
            type: string
          - name: d
            label: "설명"
            type: text
      - name: why
        label: "유블랙의 기준"
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{t}"
        fields:
          - name: t
            label: "영문 제목"
            type: string
          - name: d
            label: "설명"
            type: text
      - name: archive
        label: "경력·활동 아카이브"
        type: object
        list:
          max: 30
          collapsible:
            collapsed: true
            summary: "{year} {t}"
        fields:
          - name: k
            label: "분류 (영문)"
            type: string
          - name: year
            label: "연도"
            type: string
          - name: t
            label: "내용"
            type: string
          - name: image
            label: "사진"
            type: image
            options:
              media: images
          - name: pos
            label: "사진 초점 위치 (선택)"
            type: string
          - name: alt
            label: "사진 설명 (검색용)"
            type: string
  - name: program
    label: "페이지 · 시술 안내"
    type: file
    path: content/program.json
    format: json
    fields:
      - name: t
        label: "화면 문구·사진"
        type: object
        description: "화면에 보이는 순서대로예요. 편집 모드(/edit)에서 화면을 보면서 고치는 게 더 편해요."
        fields:
          - name: k01
            label: "k01 · PROGRAM"
            type: string
          - name: k02
            label: "k02 · SMP PROGRAM"
            type: text
          - name: k03
            label: "k03 · 시술 안내"
            type: string
          - name: k04
            label: "k04 · 유블랙 · U.BLACK · ULSAN"
            type: string
          - name: k05
            label: "k05 · 모든 프로그램은 두피 노출을 시각적으로 …"
            type: text
          - name: k06
            label: "k06 · RELATED CASES →"
            type: string
          - name: k07
            label: "k07 · WHAT IT IS"
            type: string
          - name: k08
            label: "k08 · CONSULTATION POINT"
            type: string
          - name: k09
            label: "k09 · DESIGN CONSIDERATION"
            type: string
          - name: img01
            label: "img01 · 사진"
            type: image
            options:
              media: images
      - name: programs
        label: "프로그램"
        type: object
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{ko}"
        fields:
          - name: slug
            label: "주소용 이름 (바꾸지 마세요)"
            type: string
            readonly: true
          - name: en
            label: "영문 이름"
            type: string
          - name: ko
            label: "이름"
            type: string
          - name: what
            label: "어떤 작업인가요"
            type: text
          - name: consult
            label: "상담 포인트"
            type: text
          - name: design
            label: "디자인 고려사항"
            type: text
          - name: images
            label: "사진 (최대 3장)"
            type: image
            options:
              media: images
              multiple:
                max: 3
  - name: cases
    label: "페이지 · 시술 사례"
    type: file
    path: content/cases.json
    format: json
    fields:
      - name: t
        label: "화면 문구·사진"
        type: object
        description: "화면에 보이는 순서대로예요. 편집 모드(/edit)에서 화면을 보면서 고치는 게 더 편해요."
