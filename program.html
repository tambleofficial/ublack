<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="canonical" href="https://ublack.pages.dev/program">
<meta property="og:site_name" content="U.BLACK 유블랙">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ublack.pages.dev/program">
<meta property="og:image" content="https://ublack.pages.dev/assets/director.png">
<link rel="alternate" type="application/rss+xml" title="U.BLACK 유블랙" href="/rss.xml">
<link rel="icon" href="/assets/symbol-black.png">
<title>PROGRAM — 두피문신 프로그램 | U.BLACK 유블랙</title>
<meta name="description" content="헤어라인, M자, 정수리, 가르마, 삭발 디자인, 흉터 커버 등 유블랙의 SMP 두피문신 프로그램 안내.">
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#080808"/><text x="50" y="62" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">U.B</text></svg></template>
<dc-import name="SiteChrome" active="program" admin="{{ adminNotes }}" hint-size="100%,0px"></dc-import>
<main>
<section data-theme="dark" data-screen-label="01 PROGRAM Hero" style="background:#080808;color:#fff;min-height:min(88svh,760px);padding:clamp(112px,16vw,160px) clamp(20px,6vw,96px) clamp(40px,6vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:64px">
  <div data-cms="program.t.k01" style="font-size:12px;letter-spacing:.2em;color:#B7B7B7">{{ CT.k01 }}</div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:48px">
    <div data-reveal><h1 data-cms="program.t.k02" style="margin:0;font-size:clamp(44px,7vw,108px);line-height:1.02;font-weight:500;letter-spacing:-.035em;white-space:pre-line">{{ CT.k02 }}</h1><p data-cms="program.t.k03" style="margin:22px 0 0;font-size:clamp(17px,1.6vw,22px);line-height:1.5;font-weight:500;color:#B7B7B7">{{ CT.k03 }}</p></div>
    <img data-reveal src="{{ CT.img01 }}" data-cms-img="program.t.img01" alt="" style="width:clamp(90px,10vw,150px);height:auto">
  </div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;font-size:17px;line-height:1.8;color:#B7B7B7;border-top:1px solid #2a2a2a;padding-top:28px">
    <span data-cms="program.t.k04">{{ CT.k04 }}</span><span data-cms="program.t.k05" style="max-width:460px">{{ CT.k05 }}</span>
  </div>
</section>



<div data-theme="light" style="background:#FFFFFF">
  <sc-for list="{{ programs }}" as="p" hint-placeholder-count="3">
    <article id="{{ p.slug }}" data-screen-label="{{ p.en }}" style="scroll-margin-top:150px;padding:clamp(80px,9vw,130px) clamp(20px,6vw,96px);border-bottom:1px solid #E8E8E8;background:{{ p.bg }}">
      <div style="max-width:1320px;margin:0 auto">
        <div data-reveal style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 48px;margin-bottom:48px">
          <div>
            <div data-cms="{{ p.p_n }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#666">{{ p.n }}</div>
            <h2 data-cms="{{ p.p_en }}" style="margin:12px 0 0;font-size:clamp(34px,4.4vw,64px);line-height:1;font-weight:500;letter-spacing:-.03em">{{ p.en }}</h2>
            <div data-cms="{{ p.p_ko }}" style="margin-top:14px;font-size:20px;color:#333">{{ p.ko }}</div>
          </div>
          <a data-cms="program.t.k06" href="/cases" style="font-size:13px;letter-spacing:.16em;font-weight:600;border-bottom:1px solid #080808;padding-bottom:6px">{{ CT.k06 }}</a>
        </div>
        <div style="display:flex;flex-direction:column;gap:40px">
          <dl data-reveal style="max-width:820px;margin:0;border-top:1px solid #080808">
            <div style="padding:26px 0;border-bottom:1px solid #E8E8E8"><dt data-cms="program.t.k07" style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">{{ CT.k07 }}</dt><dd data-cms="{{ p.p_what }}" style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.what }}</dd></div>
            <div style="padding:26px 0;border-bottom:1px solid #E8E8E8"><dt data-cms="program.t.k08" style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">{{ CT.k08 }}</dt><dd data-cms="{{ p.p_consult }}" style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.consult }}</dd></div>
            <div style="padding:26px 0"><dt data-cms="program.t.k09" style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">{{ CT.k09 }}</dt><dd data-cms="{{ p.p_design }}" style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.design }}</dd></div>
            </dl>
          <sc-if value="{{ p.hasG }}" hint-placeholder-val="{{ true }}"><div data-reveal style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)">
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g0 }}" data-cms-img="{{ p.p_g0 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g1 }}" data-cms-img="{{ p.p_g1 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g2 }}" data-cms-img="{{ p.p_g2 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
          </div></sc-if>
        </div>
      </div>
    </article>
  </sc-for>
</div>
</main>
<dc-import name="SiteFooter" compact="{{ true }}" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;adminNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const __D = (window.__CMS || {})["program"] || {};
    const __C = window.__CMS || {}; const CT = (__C["program"] || {}).t || {}; const CS = Object.assign({}, __C.site || {}, { tel: 'tel:' + String((__C.site || {}).phone || '').replace(/[^0-9]/g, '') });
    const P = (__D.programs || []);
    return { CT, CS,
      adminNotes: false,
      programs: P.map((p, i) => { const b = 'program.programs.' + i; const g = p.images || []; return {
        slug: p.slug, hasG: g.length > 0, g0: g[0], g1: g[1], g2: g[2], en: p.en, ko: p.ko, what: p.what, consult: p.consult, design: p.design,
        p_en: b + '.en', p_ko: b + '.ko', p_what: b + '.what', p_consult: b + '.consult', p_design: b + '.design', p_g0: b + '.images.0', p_g1: b + '.images.1', p_g2: b + '.images.2',
        n: String(i + 1).padStart(2, '0'), bg: i % 2 ? '#F6F6F4' : '#FFFFFF',
        jump: e => { const el = document.getElementById(p.slug); if (el) { e.preventDefault(); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 140, behavior: 'smooth' }); } }
      }; })
    };
  }
}
</script>
</body>
</html>
