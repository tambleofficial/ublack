<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="canonical" href="https://ublack.pages.dev/program">
<meta property="og:site_name" content="U.BLACK 유블랙">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ublack.pages.dev/program">
<meta property="og:image" content="https://ublack.pages.dev/assets/director.png">
<link rel="alternate" type="application/rss+xml" title="U.BLACK 유블랙" href="/rss.xml">
<link rel="icon" href="/assets/symbol-black.png">
<title>PROGRAM — 두피문신 프로그램 | U.BLACK 유블랙</title>
<meta name="description" content="헤어라인, M자, 정수리, 가르마, 삭발 디자인, 흉터 커버 등 유블랙의 SMP 두피문신 프로그램 안내.">
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#080808"/><text x="50" y="62" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">U.B</text></svg></template>
<dc-import name="SiteChrome" active="program" admin="{{ adminNotes }}" hint-size="100%,0px"></dc-import>
<main>
<section data-theme="dark" data-screen-label="01 PROGRAM Hero" style="background:#080808;color:#fff;min-height:min(88svh,760px);padding:clamp(112px,16vw,160px) clamp(20px,6vw,96px) clamp(40px,6vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:64px">
  <div style="font-size:12px;letter-spacing:.2em;color:#B7B7B7">PROGRAM</div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:48px">
    <div data-reveal><h1 style="margin:0;font-size:clamp(44px,7vw,108px);line-height:1.02;font-weight:500;letter-spacing:-.035em">SMP<br>PROGRAM</h1><p style="margin:22px 0 0;font-size:clamp(17px,1.6vw,22px);line-height:1.5;font-weight:500;color:#B7B7B7">시술 안내</p></div>
    <img data-reveal src="assets/symbol-white.png" alt="" style="width:clamp(90px,10vw,150px);height:auto">
  </div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;font-size:17px;line-height:1.8;color:#B7B7B7;border-top:1px solid #2a2a2a;padding-top:28px">
    <span>유블랙 · U.BLACK · ULSAN</span><span style="max-width:460px">모든 프로그램은 두피 노출을 시각적으로 보완하는 미용 목적의 SMP(두피문신) 작업이며, 결과에는 개인차가 있습니다.</span>
  </div>
</section>



<div data-theme="light" style="background:#FFFFFF">
  <sc-for list="{{ programs }}" as="p" hint-placeholder-count="3">
    <article id="{{ p.slug }}" data-screen-label="{{ p.en }}" style="scroll-margin-top:150px;padding:clamp(80px,9vw,130px) clamp(20px,6vw,96px);border-bottom:1px solid #E8E8E8;background:{{ p.bg }}">
      <div style="max-width:1320px;margin:0 auto">
        <div data-reveal style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px 48px;margin-bottom:48px">
          <div>
            <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#666">{{ p.n }}</div>
            <h2 style="margin:12px 0 0;font-size:clamp(34px,4.4vw,64px);line-height:1;font-weight:500;letter-spacing:-.03em">{{ p.en }}</h2>
            <div style="margin-top:14px;font-size:20px;color:#333">{{ p.ko }}</div>
          </div>
          <a href="/cases" style="font-size:13px;letter-spacing:.16em;font-weight:600;border-bottom:1px solid #080808;padding-bottom:6px">RELATED CASES →</a>
        </div>
        <div style="display:flex;flex-direction:column;gap:40px">
          <dl data-reveal style="max-width:820px;margin:0;border-top:1px solid #080808">
            <div style="padding:26px 0;border-bottom:1px solid #E8E8E8"><dt style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">WHAT IT IS</dt><dd style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.what }}</dd></div>
            <div style="padding:26px 0;border-bottom:1px solid #E8E8E8"><dt style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">CONSULTATION POINT</dt><dd style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.consult }}</dd></div>
            <div style="padding:26px 0"><dt style="font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:10px">DESIGN CONSIDERATION</dt><dd style="margin:0;font-size:17px;line-height:1.85;color:#333">{{ p.design }}</dd></div>
            </dl>
          <sc-if value="{{ p.hasG }}" hint-placeholder-val="{{ true }}"><div data-reveal style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.4vw,16px)">
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g0 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g1 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
            <a href="/cases" data-cursor="VIEW CASE" style="display:block;min-width:0"><div data-reveal-img style="position:relative;aspect-ratio:4/5;overflow:hidden"><img src="{{ p.g2 }}" alt="{{ p.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.02);filter:brightness(.9)"></div></a>
          </div></sc-if>
        </div>
      </div>
    </article>
  </sc-for>
</div>
</main>
<dc-import name="SiteFooter" compact="{{ true }}" hint-size="100%,600px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;adminNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['hairline', 'HAIRLINE', '남성 헤어라인', '얼굴형에 어울리는 헤어라인을 도트로 표현해 이마 라인을 시각적으로 정돈하는 작업입니다.', '원하는 헤어라인 높이와 현재 모발 경계를 함께 확인합니다.', '나이대와 얼굴 비율에 맞는 라인 높이, 잔머리처럼 보이는 가장자리 처리를 고려합니다.'],
      ['m-line', 'M-LINE', 'M자 디자인', '앞머리 양옆으로 두피가 드러나는 부위를 주변 모발과 이어지도록 시각적으로 보완합니다.', '앞쪽 두피 노출 범위와 평소 헤어스타일을 확인합니다.', '기존 헤어라인과 모발 방향을 함께 살펴 시각적 연결감을 우선합니다.'],
      ['crown', 'CROWN', '정수리', '정수리 부위의 두피 노출을 모발 사이 도트로 채워 시각적인 밀도감을 더하는 작업입니다.', '가마 위치와 두피가 드러나는 범위, 모발 길이를 확인합니다.', '가마 방향과 주변 모발 톤에 맞춰 도트 크기와 간격을 조율합니다.'],
      ['part', 'PART', '가르마', '가르마 라인이 넓어 보이는 부분을 기존 모발과 어우러지도록 시각적으로 보완합니다.', '주로 사용하는 가르마 방향과 노출되는 폭을 확인합니다.', '가르마 경계가 선처럼 보이지 않도록 가장자리 밀도를 단계적으로 조절합니다.'],
      ['shaved', 'SHAVED DESIGN', '삭발 디자인', '짧은 삭발 스타일에서 두상 전체의 톤과 헤어라인 형태를 함께 디자인하는 작업입니다.', '원하는 삭발 길이감과 헤어라인 형태를 확인합니다.', '두상 전체의 톤이 고르게 보이도록 영역별 도트 밀도를 조율합니다.'],
      ['scar', 'SCAR COVER', '흉터 커버', '흉터 부위가 주변 모발 사이에서 덜 두드러져 보이도록 시각적으로 보완하는 작업입니다.', '흉터의 위치, 크기, 피부 질감과 톤을 먼저 확인합니다.', '흉터 주변 피부 상태에 따라 가능한 범위를 한정하고 주변과의 연결감을 고려합니다.'],
      ['cover', 'VISUAL COVER', '탈모 커버', '두피 노출이 신경 쓰이는 범위를 주변 모발과 자연스럽게 어우러져 보이도록 시각적으로 보완하는 작업입니다.', '두피가 드러나는 범위와 모발 상태를 확인하고, 필요한 범위부터 상담합니다.', '과하게 넓히지 않고 현재 모습과 어우러지는 범위를 기준으로 디자인합니다.'],
      ['women', "WOMEN'S HAIRLINE", '여성 헤어라인', '이마 라인과 가르마 주변을 부드럽게 정돈해 보이도록 하는 작업입니다.', '이마 형태와 잔머리의 흐름, 평소 스타일링을 확인합니다.', '또렷한 선보다 부드러운 가장자리를 우선해 톤과 농도를 조율합니다.'],
      ['spot', 'SPOT COVER', '원형탈모 부위 커버', '두피 노출이 두드러지는 부위를 주변 모발과의 연결감을 고려해 시각적으로 커버하는 작업입니다.', '부위의 크기와 현재 상태를 확인하고, 상담이 가능한 시기인지 함께 살핍니다.', '주변 모발 밀도와 톤에 맞춰 경계가 드러나지 않도록 조율합니다.']
    ];
    const PG = {
      hairline: ['assets/cases-sm/hair/z01.jpg','assets/cases-sm/hair/z02.jpg','assets/cases-sm/hair/z03.jpg'], 'm-line': ['assets/cases-sm/hair/z09.jpg','assets/cases-sm/hair/z10.jpg','assets/cases-sm/hair/z11.jpg'], crown: ['assets/cases-sm/crown/z01.jpg','assets/cases-sm/crown/z02.jpg','assets/cases-sm/crown/z04.jpg'], part: ['assets/cases/part-01.jpg','assets/cases/part-02.jpg','assets/cases/part-03.jpg'],
      shaved: ['assets/cases-sm/shaved/1790228230564.jpg','assets/cases-sm/shaved/1790228230707.jpg','assets/cases-sm/shaved/1790228230835.jpg'],
      scar: ['assets/cases-sm/scar/z01.jpg','assets/cases-sm/scar/z02.jpg','assets/cases-sm/scar/z04.jpg'], cover: ['assets/cases-sm/crown/z05.jpg', 'assets/cases/part-05.jpg', 'assets/cases-sm/crown/z06.jpg'], women: ['assets/cases-sm/hair/z00.png', 'assets/cases-sm/hair/z05.jpg', 'assets/cases-sm/hair/z15.jpg'], spot: ['assets/cases-sm/scar/z03.jpg','assets/cases-sm/scar/z05.jpg','assets/cases-sm/scar/z06.jpg']
    };
    return {
      adminNotes: false,
      programs: P.map((p, i) => ({
        slug: p[0], hasG: !!PG[p[0]], g0: (PG[p[0]] || [])[0], g1: (PG[p[0]] || [])[1], g2: (PG[p[0]] || [])[2], en: p[1], ko: p[2], what: p[3], consult: p[4], design: p[5],
        n: String(i + 1).padStart(2, '0'), bg: i % 2 ? '#F6F6F4' : '#FFFFFF',
        jump: e => { const el = document.getElementById(p[0]); if (el) { e.preventDefault(); window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 140, behavior: 'smooth' }); } }
      }))
    };
  }
}
</script>
</body>
</html>
