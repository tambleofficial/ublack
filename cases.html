<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="canonical" href="https://ublack.pages.dev/cases">
<meta property="og:site_name" content="U.BLACK 유블랙">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ublack.pages.dev/cases">
<meta property="og:image" content="https://ublack.pages.dev/assets/director.png">
<link rel="alternate" type="application/rss+xml" title="U.BLACK 유블랙" href="/rss.xml">
<link rel="icon" href="/assets/symbol-black.png">
<title>CASES — 시술 사례 | U.BLACK 유블랙</title>
<meta name="description" content="유블랙의 실제 SMP 두피문신 작업 사례. 헤어라인, M자, 정수리, 가르마, 흉터, 기존 두피문신 보완.">
</helmet>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#080808"/><text x="50" y="62" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#fff" text-anchor="middle">U.B</text></svg></template>
<dc-import name="SiteChrome" active="cases" admin="{{ adminNotes }}" hint-size="100%,0px"></dc-import>
<main>
<section data-theme="dark" data-screen-label="01 CASES Hero" style="background:#080808;color:#fff;min-height:min(88svh,760px);padding:clamp(112px,16vw,160px) clamp(20px,6vw,96px) clamp(40px,6vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:64px">
  <div data-cms="cases.t.k01" style="font-size:12px;letter-spacing:.2em;color:#B7B7B7">{{ CT.k01 }}</div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:48px">
    <div data-reveal><h1 data-cms="cases.t.k02" style="margin:0;font-size:clamp(44px,7vw,108px);line-height:1.02;font-weight:500;letter-spacing:-.035em;white-space:pre-line">{{ CT.k02 }}</h1><p data-cms="cases.t.k03" style="margin:22px 0 0;font-size:clamp(17px,1.6vw,22px);line-height:1.5;font-weight:500;color:#B7B7B7">{{ CT.k03 }}</p></div>
    <img data-reveal src="{{ CT.img01 }}" data-cms-img="cases.t.img01" alt="" style="width:clamp(90px,10vw,150px);height:auto">
  </div>
  <div style="max-width:1320px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px;font-size:17px;line-height:1.8;color:#B7B7B7;border-top:1px solid #2a2a2a;padding-top:28px">
    <span data-cms="cases.t.k04">{{ CT.k04 }}</span><span data-cms="cases.t.k05" style="max-width:460px">{{ CT.k05 }}</span>
  </div>
</section>



<section id="cases" data-theme="light" data-screen-label="02 Case Grid" style="scroll-margin-top:76px;background:#FFFFFF;padding:48px clamp(20px,4vw,56px) clamp(100px,10vw,150px)">
  <div style="max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:48px 24px">
    <sc-for list="{{ shown }}" as="c" hint-placeholder-count="9">
      <button onClick="{{ c.open }}" data-cursor="VIEW CASE" aria-label="{{ c.id }} {{ c.area }} 사례 보기" style="all:unset;cursor:pointer;display:block;width:100%">
        <div style="position:relative;overflow:hidden;aspect-ratio:4/5">
          <img src="{{ c.src }}" data-cms-img="{{ c.p_src }}" alt="{{ c.ko }} 작업 사례" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#E8E8E8;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .6s ease" style-hover="transform:scale(1.02);filter:brightness(.9)">
        </div>
        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12px;letter-spacing:.16em;font-weight:500;color:#080808"><span data-cms="{{ c.p_id }}">{{ c.id }}</span><span data-cms="{{ c.p_area }}" style="color:#666">{{ c.area }}</span></div>
        <div data-cms="cases.t.k06" style="margin-top:6px;font-size:13px;letter-spacing:.14em;color:#080808">{{ CT.k06 }}</div>
      </button>
    </sc-for>
  </div>
</section>
</main>
<dc-import name="SiteFooter" compact="{{ true }}" hint-size="100%,600px"></dc-import>

<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="{{ cur.id }} 사례 상세" style="position:fixed;inset:0;z-index:980;background:#080808;color:#fff;overflow-y:auto">
    <div style="position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;height:76px;padding:0 clamp(20px,4vw,56px);background:rgba(8,8,8,.92);border-bottom:1px solid #1B1B1B">
      <span style="font-size:12px;letter-spacing:.2em">{{ cur.id }} · {{ cur.area }}</span>
      <button data-cms="cases.t.k07" onClick="{{ close }}" ref="{{ closeRef }}" style="background:none;border:0;color:#fff;font:inherit;font-size:13px;letter-spacing:.16em;font-weight:600;min-height:44px;cursor:pointer">{{ CT.k07 }}</button>
    </div>
    <div style="max-width:1440px;margin:0 auto;padding:40px clamp(20px,4vw,56px) 80px;display:flex;flex-wrap:wrap;gap:40px 64px">
      <div style="flex:1 1 420px;min-width:0;max-width:600px">
        <div style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#131313"><img src="{{ cur.src }}" data-cms-img="{{ cur.p_src }}" alt="{{ cur.ko }} 작업 사례" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>
        <p data-cms="cases.t.k08" style="margin:14px 0 0;font-size:14px;line-height:1.7;color:#B7B7B7">{{ CT.k08 }}</p>
        <div style="display:flex;justify-content:space-between;gap:16px;margin-top:24px">
          <button data-cms="cases.t.k09" onClick="{{ prev }}" style="background:none;border:1px solid #333;color:#fff;font:inherit;font-size:13px;letter-spacing:.14em;padding:0 20px;min-height:48px;cursor:pointer">{{ CT.k09 }}</button>
          <button data-cms="cases.t.k10" onClick="{{ next }}" style="background:none;border:1px solid #333;color:#fff;font:inherit;font-size:13px;letter-spacing:.14em;padding:0 20px;min-height:48px;cursor:pointer">{{ CT.k10 }}</button>
        </div>
      </div>
      <div style="flex:1 1 360px;min-width:0">
        <div data-cms="{{ cur.p_id }}" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#B7B7B7">{{ cur.id }}</div>
        <h2 data-cms="{{ cur.p_area }}" style="margin:10px 0 40px;font-size:clamp(30px,3.4vw,48px);font-weight:500;letter-spacing:-.01em">{{ cur.area }}</h2>
        <dl style="margin:0;border-top:1px solid #2a2a2a">
          <div style="padding:20px 0;border-bottom:1px solid #2a2a2a"><dt data-cms="cases.t.k11" style="font-size:12px;letter-spacing:.16em;color:#B7B7B7;margin-bottom:8px">{{ CT.k11 }}</dt><dd data-cms="{{ cur.p_worry }}" style="margin:0;font-size:17px;line-height:1.8">{{ cur.worry }}</dd></div>
          <div style="padding:20px 0;border-bottom:1px solid #2a2a2a"><dt data-cms="cases.t.k12" style="font-size:12px;letter-spacing:.16em;color:#B7B7B7;margin-bottom:8px">{{ CT.k12 }}</dt><dd data-cms="{{ cur.p_ko }}" style="margin:0;font-size:17px;line-height:1.8">{{ cur.ko }}</dd></div>
          <div style="padding:20px 0;border-bottom:1px solid #2a2a2a"><dt data-cms="cases.t.k13" style="font-size:12px;letter-spacing:.16em;color:#B7B7B7;margin-bottom:8px">{{ CT.k13 }}</dt><dd data-cms="{{ cur.p_dir }}" style="margin:0;font-size:17px;line-height:1.8">{{ cur.dir }}</dd></div>
        </dl>
        <p data-cms="cases.t.k14" style="margin:24px 0 0;font-size:14px;line-height:1.7;color:#B7B7B7">{{ CT.k14 }}</p>
        <div data-cms="cases.t.k15" style="margin-top:48px;font-size:12px;letter-spacing:.2em;color:#B7B7B7;margin-bottom:16px">{{ CT.k15 }}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          <sc-for list="{{ others }}" as="o" hint-placeholder-count="3">
            <button onClick="{{ o.open }}" style="all:unset;cursor:pointer;display:block">
              <div style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#131313"><img src="{{ o.src }}" data-cms-img="{{ o.p_src }}" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></div>
              <div data-cms="{{ o.p_id }}" style="margin-top:8px;font-size:11px;letter-spacing:.12em">{{ o.id }}</div>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;adminNotes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { filter: 'ALL', open: -1, ba: 50 };
  baRef = React.createRef(); closeRef = React.createRef();
  componentDidMount() {
    this.onKey = e => {
      if (this.state.open < 0) return;
      if (e.key === 'Escape') this.close();
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); document.body.style.overflow = ''; }
  componentDidUpdate(pp, ps) {
    if (ps.open < 0 && this.state.open >= 0) { document.body.style.overflow = 'hidden'; this.closeRef.current && this.closeRef.current.focus(); }
    if (ps.open >= 0 && this.state.open < 0) document.body.style.overflow = '';
  }
  close() { this.setState({ open: -1 }); }
  list() { const f = this.state.filter; return this.cases().filter(c => f === 'ALL' || c.cat === f); }
  step(d) { const l = this.list(); const i = l.findIndex(c => c.i === this.state.open); const n = l[(i + d + l.length) % l.length]; this.setState({ open: n.i, ba: 50 }); }
  setBa(e) { const r = this.baRef.current.getBoundingClientRect(); this.setState({ ba: Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100)) }); }
  cases() {
    if (this._c && !window.__CMS_EDIT) return this._c;
    const __D = (window.__CMS || {}).cases || {};
    const CATS = __D.cats || [];
    const G = {}, D = {}, CI = {};
    CATS.forEach((c, ci) => { G[c.key] = c.images || []; D[c.key] = c; CI[c.key] = ci; });
    const keys = Object.keys(G), total = keys.reduce((s, k) => s + G[k].length, 0), seq = [];
    for (let r = 0; seq.length < total; r++) keys.forEach(k => { if (G[k][r]) seq.push([k, G[k][r], r]); });
    this._c = seq.map(([cat, src, r], i) => { const b = 'cases.cats.' + CI[cat]; return { i, cat, src, id: 'CASE ' + String(i + 1).padStart(3, '0'), area: D[cat].area, ko: D[cat].ko, worry: D[cat].worry, dir: D[cat].dir,
      p_src: b + '.images.' + r, p_area: b + '.area', p_ko: b + '.ko', p_worry: b + '.worry', p_dir: b + '.dir' }; });
    return this._c;
  }
  renderVals() {
    const __C = window.__CMS || {}; const CT = (__C["cases"] || {}).t || {}; const CS = Object.assign({}, __C.site || {}, { tel: 'tel:' + String((__C.site || {}).phone || '').replace(/[^0-9]/g, '') });
    const { filter, open, ba } = this.state;
    const all = this.cases();
    const cats = ['ALL', 'HAIRLINE', 'WOMEN', 'CROWN', 'PART', 'SCAR', 'SHAVED'];
    const __D = (window.__CMS || {}).cases || {};
    const catKo = { ALL: __D.allLabel || '전체' }; (__D.cats || []).forEach(c => { catKo[c.key] = c.label; });
    const shown = this.list().map(c => ({ ...c, open: () => this.setState({ open: c.i, ba: 50 }) }));
    const cur = open >= 0 ? all[open] : all[0];
    const others = all.filter(c => c.cat === cur.cat && c.i !== cur.i).concat(all.filter(c => c.cat !== cur.cat)).slice(0, 3).map(c => ({ id: c.id, src: c.src, p_src: c.p_src, open: () => this.setState({ open: c.i, ba: 50 }) }));
    return { CT, CS,
      adminNotes: false,
      fields: ['SMP 기초', '디자인 · 헤어라인', '부위별 적용', '상담 · 사후관리'].map((t, i) => ({ n: String(i + 1).padStart(2, '0'), t })),
      acts: ['SEMINAR', 'JUDGING', 'COMPETITION', 'EDUCATION'].map(k => ({ k })),
      gallery: ['SEMINAR', 'CLASS', 'JUDGING', 'STUDENT WORK', 'STUDENT WORK', 'COMPETITION'].map(t => ({ t })),
      filters: cats.map(c => { const on = c === filter; return { label: catKo[c] || c, on, count: c === 'ALL' ? all.length : all.filter(x => x.cat === c).length, bg: on ? '#080808' : 'transparent', fg: on ? '#fff' : '#080808', line: on ? '#080808' : '#B7B7B7', pick: () => this.setState({ filter: c }) }; }),
      shown, modalOpen: open >= 0, cur, others,
      close: () => this.close(), prev: () => this.step(-1), next: () => this.step(1),
      closeRef: this.closeRef, baRef: this.baRef, ba: Math.round(ba), baClip: `inset(0 ${100 - ba}% 0 0)`, baLeft: ba + '%',
      baDown: e => { this.baDrag = true; e.currentTarget.setPointerCapture(e.pointerId); this.setBa(e); },
      baMove: e => { if (this.baDrag) this.setBa(e); }, baUp: () => { this.baDrag = false; },
      baInput: e => this.setState({ ba: +e.target.value })
    };
  }
}
</script>
</body>
</html>
